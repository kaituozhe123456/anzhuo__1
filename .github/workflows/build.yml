name: Build Flet APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Flet
        run: pip install "flet[all]"

      - name: Build APK
        env:
          FLET_SERVER_URL: "https://flet.dev"
        run: echo "y" | flet build apk --arch arm64-v8a --clear-cache

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ShangShangQian-APK
          path: build/apk/*.apk
          if-no-files-found: error
